name: Set repository topics
on:
  push:
    branches: [arena/ba799aff-for-turion]
    paths: ['.github/workflows/set-topics.yml']
permissions: write-all
jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - name: Apply five topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          topics='{"names":["openc3","cosmos","satellite-telemetry","ground-software","satellite-operations"]}'
          if ! printf '%s' "$topics" | gh api -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            /repos/nakshjhaai-lgtm/cosmos-tlm-bridge/topics --input -; then
            node_id="$(gh api /repos/nakshjhaai-lgtm/cosmos-tlm-bridge --jq '.node_id')"
            jq -n --arg rid "$node_id" '{query:"mutation($input:UpdateTopicsInput!){updateTopics(input:$input){invalidTopicNames repository{name}}}",variables:{input:{repositoryId:$rid,topicNames:["openc3","cosmos","satellite-telemetry","ground-software","satellite-operations"]}}}' \
              | gh api graphql --input -
          fi
          echo 'Topics now:'
          gh api /repos/nakshjhaai-lgtm/cosmos-tlm-bridge/topics --jq '.names'
