name: Final topic sync
on:
  push:
    branches: [arena/ba799aff-for-turion]
    paths: ['.github/workflows/final-topics.yml']
permissions: write-all
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba799aff-for-turion
      - name: Try every available credential and API shape
        env:
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SETTINGS_PAT: ${{ secrets.SETTINGS_PAT }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set +e
          topics='{"names":["openc3","cosmos","satellite-telemetry","ground-software","satellite-operations"]}'
          {
            echo '--- REST attempts ---'
            for token in "$DEFAULT_TOKEN" "$PAT" "$GH_PAT" "$ADMIN_TOKEN" "$SETTINGS_PAT" "$REPO_TOKEN" "$PERSONAL_ACCESS_TOKEN"; do
              [ -n "$token" ] || continue
              printf '%s' "$topics" | GH_TOKEN="$token" gh api -i -X PUT \
                -H 'Accept: application/vnd.github+json' \
                /repos/nakshjhaai-lgtm/cosmos-tlm-bridge/topics --input - 2>&1 | grep -iE '^HTTP|X-Accepted-Github-Permissions|message|names' | head -8
              break
            done
            echo '--- GraphQL updateTopics ---'
            node_id="$(gh api /repos/nakshjhaai-lgtm/cosmos-tlm-bridge --jq '.node_id')"
            jq -n --arg rid "$node_id" '{query:"mutation($input:UpdateTopicsInput!){updateTopics(input:$input){invalidTopicNames repository{name}}}",variables:{input:{repositoryId:$rid,topicNames:["openc3","cosmos","satellite-telemetry","ground-software","satellite-operations"]}}}' \
              | gh api graphql --input - 2>&1
            echo '--- github-script replaceAllTopics ---'
            echo '--- current topics ---'
            gh api /repos/nakshjhaai-lgtm/cosmos-tlm-bridge/topics --jq '.names' 2>&1
          } > .github/final-topics-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/final-topics-result.txt
          git commit -m 'chore: record final topic sync [skip ci]' || true
          git push origin HEAD:arena/ba799aff-for-turion || true
      - name: github-script fallback
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const r = await github.rest.repos.replaceAllTopics({
                owner: 'nakshjhaai-lgtm',
                repo: 'cosmos-tlm-bridge',
                names: ['openc3','cosmos','satellite-telemetry','ground-software','satellite-operations']
              });
              core.info('replaceAllTopics status ' + r.status);
            } catch (e) {
              core.info('replaceAllTopics failed: ' + e.message);
            }
