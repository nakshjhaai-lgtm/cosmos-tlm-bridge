name: Definition of Done
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: definition-of-done-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python · Go · Docker · kubectl · air-gap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install kubectl client
        run: |
          set -euo pipefail
          sudo curl -fsSLo /usr/local/bin/kubectl \
            https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          sudo chmod +x /usr/local/bin/kubectl
          kubectl version --client

      - name: Confirm Docker
        run: docker compose version && docker info --format '{{.ServerVersion}}'

      - name: Run every Definition-of-Done gate
        env:
          RUN_CLUSTER: '1'
          VERIFY_LOG: docs/evidence/verification-all.log
        run: bash scripts/verify-all.sh

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: definition-of-done-log
          path: |
            docs/evidence/verification-all.log
            docs/evidence/ci-verification.log
          if-no-files-found: ignore
