name: Set topics with explicit administration permission
on:
  push:
    branches: [arena/ba799aff-for-turion]
    paths: ['.github/workflows/set-topics-2.yml']
permissions:
  administration: write
  contents: read
jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba799aff-for-turion
      - name: Apply topics and record result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo '--- REST PUT /topics ---'
            printf '%s' '{"names":["openc3","cosmos","satellite-telemetry","ground-software","satellite-operations"]}' | gh api -i -X PUT \
              -H 'Accept: application/vnd.github+json' \
              /repos/nakshjhaai-lgtm/cosmos-tlm-bridge/topics --input - 2>&1
            echo '--- GraphQL updateTopics ---'
            node_id="$(gh api /repos/nakshjhaai-lgtm/cosmos-tlm-bridge --jq '.node_id')"
            jq -n --arg rid "$node_id" '{query:"mutation($input:UpdateTopicsInput!){updateTopics(input:$input){invalidTopicNames repository{name}}}",variables:{input:{repositoryId:$rid,topicNames:["openc3","cosmos","satellite-telemetry","ground-software","satellite-operations"]}}}' \
              | gh api graphql --input - 2>&1
            echo '--- current topics ---'
            gh api /repos/nakshjhaai-lgtm/cosmos-tlm-bridge/topics --jq '.names' 2>&1
          } > .github/topics-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/topics-result.txt
          git commit -m 'chore: record topic attempt [skip ci]' || true
          git push origin HEAD:arena/ba799aff-for-turion || true
