name: Probe Actions credentials
on:
  push:
    branches: [arena/ba799aff-for-turion]
    paths: ['.github/workflows/probe-secrets.yml']
permissions: write-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba799aff-for-turion
      - name: Record credential names without values
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ID: ${{ vars.APP_ID }}
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          ARENA_APP_ID: ${{ vars.ARENA_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          ARENA_APP_PRIVATE_KEY: ${{ secrets.ARENA_APP_PRIVATE_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -u
          {
            echo "APP_ID ${APP_ID:+present}"
            echo "GH_APP_ID ${GH_APP_ID:+present}"
            echo "ARENA_APP_ID ${ARENA_APP_ID:+present}"
            echo "APP_PRIVATE_KEY ${APP_PRIVATE_KEY:+present}"
            echo "GH_APP_PRIVATE_KEY ${GH_APP_PRIVATE_KEY:+present}"
            echo "ARENA_APP_PRIVATE_KEY ${ARENA_APP_PRIVATE_KEY:+present}"
            echo "PRIVATE_KEY ${PRIVATE_KEY:+present}"
            echo '--- secret names ---'
            gh secret list -R nakshjhaai-lgtm/cosmos-tlm-bridge 2>&1 || true
            echo '--- repository variables ---'
            gh api /repos/nakshjhaai-lgtm/cosmos-tlm-bridge/actions/variables --jq '.variables[].name' 2>&1 || true
          } > .github/credential-probe.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/credential-probe.txt
          git commit -m 'chore: record credential probe [skip ci]' || true
          git push origin HEAD:arena/ba799aff-for-turion || true
