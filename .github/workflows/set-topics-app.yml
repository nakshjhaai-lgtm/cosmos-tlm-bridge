name: Set topics with installation app token
on:
  push:
    branches: [arena/ba799aff-for-turion]
    paths: ['.github/workflows/set-topics-app.yml']
permissions:
  contents: read
jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba799aff-for-turion
      - name: Try app token names
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Apply topics
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          token="${GH_TOKEN:-$FALLBACK_TOKEN}"
          {
            echo "app token present: ${GH_TOKEN:+yes}"
            echo '--- REST PUT /topics ---'
            printf '%s' '{"names":["openc3","cosmos","satellite-telemetry","ground-software","satellite-operations"]}' | GH_TOKEN="$token" gh api -i -X PUT \
              -H 'Accept: application/vnd.github+json' \
              /repos/nakshjhaai-lgtm/cosmos-tlm-bridge/topics --input - 2>&1
            echo '--- current topics ---'
            GH_TOKEN="$token" gh api /repos/nakshjhaai-lgtm/cosmos-tlm-bridge/topics --jq '.names' 2>&1
          } > .github/topics-app-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/topics-app-result.txt
          git commit -m 'chore: record app-token topic attempt [skip ci]' || true
          git push origin HEAD:arena/ba799aff-for-turion || true
