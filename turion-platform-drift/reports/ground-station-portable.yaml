---
# Replaces DynamoDB/RDS with PostgreSQL on the ground station.
# Plain StatefulSet + PVC + Secret: no operator, no CRD, no AWS.
apiVersion: v1
kind: Secret
metadata:
  name: ground-telemetry-db
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-dynamodb
type: Opaque
stringData:
  # Populated by the operator (or Vault/External Secrets) before first start.
  POSTGRES_DB: telemetry
  POSTGRES_USER: ground
  POSTGRES_PASSWORD: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ground-telemetry-db
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-dynamodb
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ground-telemetry-db
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-dynamodb
spec:
  serviceName: ground-telemetry-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ground-telemetry-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ground-telemetry-db
        ground.turion.space/replaces: aws-dynamodb
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: registry.ground.local/library/postgres:16.15
          ports:
            - {name: sql, containerPort: 5432}
          envFrom:
            - secretRef:
                name: ground-telemetry-db
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ground", "-d", "telemetry"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ground", "-d", "telemetry"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ground-telemetry-db
---
apiVersion: v1
kind: Service
metadata:
  name: ground-telemetry-db
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-dynamodb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ground-telemetry-db
  ports:
    - {name: sql, port: 5432, targetPort: 5432}

