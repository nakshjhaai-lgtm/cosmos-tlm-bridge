# Generated by turion-platform-drift from ./ground-service
# Portable replacement artifact: bundle
# Namespace: ground-system  Target: kubernetes  Object store: versitygw
# Validate:  kubectl apply --dry-run=client -f .
# Air gap:   turion-platform-drift validate .
apiVersion: v1
kind: Namespace
metadata:
  name: ground-system
  labels:
    app.kubernetes.io/part-of: turion-ground-system
    ground.turion.space/managed-by: turion-platform-drift
    pod-security.kubernetes.io/enforce: restricted

---
# OpenC3-compatible object-store shim (S3 API).
# versitygw exposes the S3 wire protocol on-cluster so ground services and OpenC3
# COSMOS targets can keep using S3 primitives with no AWS endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: objectstore-credentials
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-s3
type: Opaque
stringData:
  # Rotate at deploy time; never commit real values.
  ROOT_ACCESS_KEY: "ground-access-key"
  ROOT_SECRET_KEY: "ground-secret-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: objectstore-config
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-s3
data:
  OBJECT_STORE_ENDPOINT: "http://objectstore.ground-system.svc.cluster.local:7070"
  OBJECT_STORE_REGION: "ground-local"
  OBJECT_STORE_FORCE_PATH_STYLE: "true"
  OBJECT_STORE_BUCKETS: "archive-bucket-turion-tlm-archive-prod,ephemeris-bucket-turion-droid-ephemeris,raw-bucket-turion-droid-downlink-raw"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: versitygw-data
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-s3
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: versitygw
  namespace: ground-system
  labels:
    app.kubernetes.io/name: versitygw
    ground.turion.space/replaces: aws-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: versitygw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versitygw
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: versitygw
          image: registry.ground.local/versity/versitygw:v1.0.0
          args: ["posix", "/data"]
          envFrom:
            - secretRef:
                name: objectstore-credentials
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: objectstore-credentials, key: ROOT_ACCESS_KEY}
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: objectstore-credentials, key: ROOT_SECRET_KEY}
            - name: VGW_REGION
              value: ground-local
            - name: VGW_PORT
              value: "7070"
          ports:
            - {name: s3, containerPort: 7070}
          readinessProbe:
            tcpSocket: {port: s3}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: versitygw-data
---
apiVersion: v1
kind: Service
metadata:
  name: objectstore
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-s3
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: versitygw
  ports:
    - {name: s3, port: 7070, targetPort: 7070}

---
# Replaces S3 bucket creation with a bootstrap Job against the in-cluster
# S3-compatible endpoint. Uses curl --aws-sigv4, so no AWS SDK and no CRD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: objectstore-buckets
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-s3
data:
  archive-bucket-turion-tlm-archive-prod: ""
  ephemeris-bucket-turion-droid-ephemeris: ""
  raw-bucket-turion-droid-downlink-raw: ""
---
apiVersion: batch/v1
kind: Job
metadata:
  name: objectstore-bucket-bootstrap
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-s3
    ground.turion.space/component: bootstrap
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        ground.turion.space/component: bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-buckets
          image: registry.ground.local/curlimages/curl:8.14.1
          command: ["sh", "-ec"]
          args:
            - |
              for bucket in "archive-bucket-turion-tlm-archive-prod" "ephemeris-bucket-turion-droid-ephemeris" "raw-bucket-turion-droid-downlink-raw"; do
                echo "ensuring bucket $bucket"
                curl -sS --fail-with-body --retry 30 --retry-all-errors --retry-delay 2 \
                  --aws-sigv4 "aws:amz:ground-local:s3" \
                  --user "${ROOT_ACCESS_KEY_ID}:${ROOT_SECRET_ACCESS_KEY}" \
                  -X PUT "http://objectstore:7070/$bucket" >/dev/null
              done
              echo "buckets ready"
          envFrom:
            - secretRef:
                name: objectstore-credentials
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
# Replaces CloudWatch Logs / X-Ray with an in-cluster OpenTelemetry pipeline.
# Exporters are OTLP/Prometheus/Loki: all reachable from an air-gapped cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-cloudwatch
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch: {}
      resourcedetection:
        detectors: [env]
    exporters:
      debug: {verbosity: basic}
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion: {enabled: true}
      otlphttp/loki:
        endpoint: http://loki.ground-system.svc.cluster.local:3100/otlp
        tls: {insecure: true}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resourcedetection]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resourcedetection]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resourcedetection]
          exporters: [debug, otlphttp/loki]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-cloudwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        ground.turion.space/replaces: aws-cloudwatch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: registry.ground.local/otel/opentelemetry-collector-contrib:0.132.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8889}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /conf}
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-cloudwatch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: metrics, port: 8889, targetPort: 8889}

