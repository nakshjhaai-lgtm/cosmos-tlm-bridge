---
# Replaces CloudWatch Logs / X-Ray with an in-cluster OpenTelemetry pipeline.
# Exporters are OTLP/Prometheus/Loki — all reachable from an air-gapped cluster.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-cloudwatch
spec:
  mode: deployment
  replicas: 1
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch: {}
      resourcedetection:
        detectors: [env]
    exporters:
      debug:
        verbosity: basic
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      otlphttp/loki:
        endpoint: http://loki.ground-system.svc.cluster.local:3100/otlp
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resourcedetection]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resourcedetection]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resourcedetection]
          exporters: [debug, otlphttp/loki]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-cloudwatch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: metrics, port: 8889, targetPort: 8889}

