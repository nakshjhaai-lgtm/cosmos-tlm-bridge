# Generated by turion-platform-drift from ./ground-service
# Portable replacement artifact: bundle
# Namespace: ground-system  Target: crossplane  Object store: versitygw
# Validate:  kubectl apply --dry-run=client -f .
# Air gap:   turion-platform-drift validate .
apiVersion: v1
kind: Namespace
metadata:
  name: ground-system
  labels:
    app.kubernetes.io/part-of: turion-ground-system
    ground.turion.space/managed-by: turion-platform-drift
    pod-security.kubernetes.io/enforce: restricted

---
# OpenC3-compatible object-store shim (S3 API).
# versitygw exposes the S3 wire protocol on-cluster so ground services and OpenC3
# COSMOS targets can keep using S3 primitives with no AWS endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: objectstore-credentials
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-s3
type: Opaque
stringData:
  # Rotate at deploy time; never commit real values.
  ROOT_ACCESS_KEY: "ground-access-key"
  ROOT_SECRET_KEY: "ground-secret-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: objectstore-config
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-s3
data:
  OBJECT_STORE_ENDPOINT: "http://objectstore.ground-system.svc.cluster.local:7070"
  OBJECT_STORE_REGION: "ground-local"
  OBJECT_STORE_FORCE_PATH_STYLE: "true"
  OBJECT_STORE_BUCKETS: "archive-bucket-turion-tlm-archive-prod,ephemeris-bucket-turion-droid-ephemeris,raw-bucket-turion-droid-downlink-raw"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: versitygw-data
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-s3
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: versitygw
  namespace: ground-system
  labels:
    app.kubernetes.io/name: versitygw
    ground.turion.space/replaces: aws-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: versitygw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versitygw
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: versitygw
          image: registry.ground.local/versity/versitygw:v1.0.0
          args: ["posix", "/data"]
          envFrom:
            - secretRef:
                name: objectstore-credentials
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: objectstore-credentials, key: ROOT_ACCESS_KEY}
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: objectstore-credentials, key: ROOT_SECRET_KEY}
            - name: VGW_REGION
              value: ground-local
            - name: VGW_PORT
              value: "7070"
          ports:
            - {name: s3, containerPort: 7070}
          readinessProbe:
            tcpSocket: {port: s3}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: versitygw-data
---
apiVersion: v1
kind: Service
metadata:
  name: objectstore
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-s3
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: versitygw
  ports:
    - {name: s3, port: 7070, targetPort: 7070}

