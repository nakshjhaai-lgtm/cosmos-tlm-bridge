          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    namespace:
                      type: string
                      description: Ground-station namespace (default ground-system).
                      default: ground-system
                    bucketName:
                      type: string
                      description: S3-compatible bucket for telemetry archive.
                      default: tlm-archive
                    objectStore:
                      type: string
                      description: Object-store shim implementation.
                      enum: ["versitygw", "minio"]
                      default: versitygw
                    retentionDays:
                      type: integer
                      default: 90
                  required: ["namespace"]
              required: ["parameters"]
          required: ["spec"]

---
# Crossplane composition: one GroundStack composite provisions the whole
# portable ground-service stack with no AWS provider installed.
# Requires Crossplane >= 2.0 and the function-patch-and-transform function:
#   kubectl apply -f - <<'EOF'
#   apiVersion: pkg.crossplane.io/v1
#   kind: Function
#   metadata: {name: function-patch-and-transform}
#   spec: {package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.9.0}
#   EOF
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: groundstack.ground.turion.space
  labels:
    ground.turion.space/managed-by: turion-platform-drift
spec:
  compositeTypeRef:
    apiVersion: ground.turion.space/v1alpha1
    kind: GroundStack
  writeConnectionSecretsToNamespace: crossplane-system
  mode: Pipeline
  pipeline:
    - step: provision-portable-stack
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: namespace
            base:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: placeholder
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.namespace
                toFieldPath: metadata.name
          - name: objectstore
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha1
              kind: Object
              metadata:
                name: objectstore-deployment
              spec:
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: versitygw
                    spec:
                      replicas: 1
                      selector:
                        matchLabels:
                          app: versitygw
                      template:
                        metadata:
                          labels:
                            app: versitygw
                        spec:
                          containers:
                            - name: versitygw
                              image: registry.ground.local/versity/versitygw:v1.0.0
                              args: ["posix", "/data"]
                              port: 7070
                providerConfigRef:
                  name: ground-kubernetes
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
          - name: objectbucket
            base:
              apiVersion: s3.min.io/v1alpha1
              kind: Bucket
              metadata:
                name: placeholder
              spec:
                name: placeholder
                retention:
                  mode: GOVERNANCE
                  unit: days
                  validity: 90
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.bucketName
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.bucketName
                toFieldPath: spec.name
          - name: otel
            base:
              apiVersion: opentelemetry.io/v1beta1
              kind: OpenTelemetryCollector
              metadata:
                name: otel
              spec:
                mode: deployment
          - name: postgres
            base:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: ground-telemetry-db
              spec:
                instances: 3
                storage:
                  size: 50Gi
