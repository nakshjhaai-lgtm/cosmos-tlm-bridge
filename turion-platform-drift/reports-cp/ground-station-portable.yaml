# Replaces DynamoDB/RDS with CloudNativePG PostgreSQL on the ground station.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ground-telemetry-db
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-dynamodb
spec:
  instances: 3
  imageName: registry.ground.local/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  storage:
    size: 50Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  bootstrap:
    initdb:
      database: telemetry
      owner: ground
      encoding: UTF8
  monitoring:
    enablePodMonitor: true

---
# Replaces AWS Secrets Manager / SSM Parameter Store with External Secrets
# Operator backed by Vault (or any Kubernetes Secret in an air gap).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ground-vault
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-secretsmanager
spec:
  provider:
    vault:
      server: http://vault.ground-system.svc.cluster.local:8200
      path: ground-system
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ground-service
          serviceAccountRef:
            name: ground-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ground-service-credentials
  namespace: ground-system
  labels:
    ground.turion.space/replaces: aws-secretsmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ground-vault
    kind: SecretStore
  target:
    name: ground-service-credentials
    creationPolicy: Owner
  data:
    - secretKey: OBJECT_STORE_ACCESS_KEY
      remoteRef: {key: ground-system/objectstore, property: access_key}
    - secretKey: OBJECT_STORE_SECRET_KEY
      remoteRef: {key: ground-system/objectstore, property: secret_key}

