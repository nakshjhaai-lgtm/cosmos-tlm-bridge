# Reference OpenTelemetry Collector for a ground service: OTLP in,
# Prometheus + Loki + Tempo out. No CloudWatch, no X-Ray, no egress.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: ground-otel
  namespace: ground-system
spec:
  mode: deployment
  replicas: 1
  observability:
    metrics:
      enableMetrics: true
  config:
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
      prometheus:
        config:
          scrape_configs:
            - job_name: ground-services
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
    processors:
      memory_limiter: {check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 20}
      batch: {}
      resourcedetection:
        detectors: [env, system]
      attributes/ground:
        actions:
          - {key: ground.segment, value: droid, action: insert}
          - {key: ground.site, value: ground-a, action: insert}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion: {enabled: true}
      otlphttp/tempo:
        endpoint: http://tempo.ground-system.svc.cluster.local:4318
        tls: {insecure: true}
      otlphttp/loki:
        endpoint: http://loki.ground-system.svc.cluster.local:3100/otlp
        tls: {insecure: true}
      debug: {verbosity: basic}
    service:
      telemetry:
        metrics:
          level: detailed
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, attributes/ground, batch]
          exporters: [otlphttp/tempo, debug]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, attributes/ground, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, attributes/ground, batch]
          exporters: [otlphttp/loki]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ground-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ground-otel-collector
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: metrics, port: 8889, targetPort: 8889}
