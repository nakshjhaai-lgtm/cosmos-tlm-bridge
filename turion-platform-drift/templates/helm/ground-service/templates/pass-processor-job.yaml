apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-pass-processor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-pass-processor
    ground.turion.space/replaces: aws-batch
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-pass-processor
    spec:
      restartPolicy: Never
      serviceAccountName: ground-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pass-processor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "-m", "ground_service.pass_processor"]
          args: ["--pass-id", {{ .Values.passId | default "1" | quote }}]
          env:
            - name: OBJECT_STORE_ENDPOINT
              value: {{ .Values.objectStore.endpoint | quote }}
            - name: OBJECT_STORE_REGION
              value: {{ .Values.objectStore.region | quote }}
            - name: OBJECT_STORE_FORCE_PATH_STYLE
              value: {{ .Values.objectStore.forcePathStyle | quote }}
            - name: ARCHIVE_BUCKET
              value: {{ .Values.objectStore.buckets.tlmArchive | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.serviceName | quote }}
          envFrom:
            - secretRef: {name: objectstore-credentials}
          resources:
{{ toYaml .Values.job.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
