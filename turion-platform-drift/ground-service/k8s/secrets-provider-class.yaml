apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ground-aws-secrets
  namespace: ground-system
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "ground/passes/api-token"
        objectType: "secretsmanager"
      - objectName: "/ground/pass-processing/endpoint"
        objectType: "ssmparameter"
