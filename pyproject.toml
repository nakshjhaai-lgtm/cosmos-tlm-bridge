[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cosmos-tlm-bridge"
version = "1.0.0"
description = "OpenC3 COSMOS v5 telemetry-to-microservice bridge and declarative CI regression runner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Turion Space Ground Software" }]
keywords = ["openc3", "cosmos", "telemetry", "satellite", "ground-segment", "droid", "spacecraft"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]
# Intentionally tiny: Pydantic for the typed contract, PyYAML for suites.
# There is no OpenC3 SDK, no AWS SDK, no API key, and no Ruby dependency.
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/turion-space/cosmos-tlm-bridge"
Issues = "https://github.com/turion-space/cosmos-tlm-bridge/issues"

[project.scripts]
cosmos-tlm-bridge = "cosmos_tlm_bridge.cli:main"
cosmos-regress = "cosmos_tlm_bridge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pillow>=10"]

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_tlm_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"definitions" = "cosmos_tlm_bridge/_bundled/definitions"
"suites" = "cosmos_tlm_bridge/_bundled/suites"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
